clip_actions: true
control_frequency_inv: 5
fatigue_reset_random: false
fatigue_reset_vec: null
gail_hidden_units:
- 512
- 512
- 256
kd_scale: 1.0
knockout_muscles: null
kp_scale: 1.0
lr_disc: 0.0003
muscle_condition: ''
persistent_fatigue: false
resampling_interval: 100
reward_specs:
  k_energy: 0.05
  k_pos: 200
  k_vel: 5
  w_energy: 0.01
  w_motor_effort: 0.2
  w_gail: 0.1
  w_pos: 0.6
  w_upright: 1.0
  w_vel: 0.2
  w_state_oob: 0.1
sim_timestep_inv: 150
task: MyoLegs OSL_KA GAIL
termination_distance: 0.15
pd_control: true
impedance_control: false
active_gains: false
fixed_knee_stiffness: 0.0
fixed_knee_damping: 1.0
fixed_knee_target: 0.0
fixed_ankle_stiffness: 200.0
fixed_ankle_damping: 5.0
fixed_ankle_target: 0.0

# FK body-segment tracking parameters
w_track_pelvis: 2.0   # Gaussian sharpness for pelvis body error (pos + vel)
w_track_body: 1.0     # Gaussian sharpness for non-pelvis body error (pos + vel)
w_body_pos: 1.0       # Multiplier on body_pos_reward in total reward
w_body_vel: 0.3       # Multiplier on body_vel_reward in total reward

# Forward velocity reward: R_vel = exp(-2*(vx - target)^2), always [0,1]
# Set to 0 to disable; increase to prioritise forward motion over tracking fidelity
w_vel_reward: 0.3
obs_tracking_reference: true # include q_hat, qvel_hat in proprioception (visible to policy)
